<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloxd Blocks Studio — Éditeur visuel JavaScript</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#070914;--panel:#0d1122;--panel2:#11172d;--panel3:#161d37;--line:#222b4c;
      --text:#c7d1ef;--muted:#6b789f;--dim:#404a70;--bright:#f4f7ff;
      --blue:#3d6fff;--cyan:#00d4ff;--green:#22c55e;--orange:#f97316;--pink:#ec4899;
      --yellow:#fbbf24;--purple:#a78bfa;--red:#ef4444;--shadow:rgba(0,0,0,.45)
    }
    body.light{--bg:#f4f7ff;--panel:#ffffff;--panel2:#eef3ff;--panel3:#e3ebfb;--line:#c8d3ea;--text:#26324f;--muted:#60708f;--dim:#8a98b4;--bright:#111827;--shadow:rgba(37,54,90,.18)}
    body.light main{background:radial-gradient(circle at 20% 15%,rgba(61,111,255,.13),transparent 28%),var(--bg)}
    body.light #code{background:#f9fbff}
    body.light header{background:linear-gradient(180deg,#ffffff,#eef3ff)}
    body.light #workspace{background-image:radial-gradient(circle,#c8d3ea 1px,transparent 1px)}
    body.light .tool{background:linear-gradient(180deg,#ffffff,#eef3ff);box-shadow:0 8px 22px rgba(37,54,90,.10)}
    body.light .tool:hover{background:#f8fbff}
    body.light .block{background:linear-gradient(180deg,#ffffff,#f4f7ff);box-shadow:0 12px 28px rgba(37,54,90,.13)}
    body.light .blockHead{background:transparent}
    body.light .empty{background:rgba(255,255,255,.72);border-color:rgba(61,111,255,.24)}
    body.light .inp,body.light .sel{background:#ffffff;border-color:#c8d3ea;color:#25603a}
    body.light .miniBtn,body.light .hbtn,body.light .iconBtn,body.light .zoomBadge,body.light .count{background:#ffffff;border-color:#c8d3ea;color:#52617f}
    body.light .miniBtn:hover,body.light .hbtn:hover,body.light .iconBtn:hover{color:#111827;background:#f8fbff}
    body.light .body{background:rgba(244,247,255,.55)}
    body.light .dropzone.dragover{background:rgba(61,111,255,.10)}
    body.light .line{color:#26324f}
    body.light .ln{color:#9aa8c3}
    body.light .cmt{color:#7a8aab}
    body.light .tag{background:rgba(61,111,255,.08)}
    body.light aside.deleteTarget{background:linear-gradient(180deg,rgba(239,68,68,.08),#ffffff)}
    body.light .workspaceTop{background:rgba(255,255,255,.86);border-bottom-color:#c8d3ea;backdrop-filter:blur(10px)}
    body.light .codeMini{color:#383A42}
    body.light .tok-kw{color:#A626A4}.body.light .tok-prop,body.light .tok-var{color:#383A42}
    body.light .tok-fn{color:#4078F2}.body.light .tok-pun,body.light .tok-op{color:#0184BC}
    body.light .tok-str{color:#50A14F}.body.light .tok-num{color:#E45649}
    body.light .tok-bool,body.light .tok-null{color:#C18401}..body.light .tok-cmt{color:#A0A1A7}
    body.light .kw{color:#A626A4}.body.light .prop,body.light .var{color:#383A42}.body.light .fn{color:#4078F2}
    body.light .str{color:#50A14F}.body.light .num{color:#E45649}.body.light .pun,body.light .op{color:#0184BC}
    body.light .bool,body.light .nul{color:#C18401}.body.light .cmt{color:#8A8F99}
    body.light .line{color:#383A42}
    body.light .contextMenu{background:#fff;border-color:#c8d3ea;box-shadow:0 20px 50px rgba(37,54,90,.22)}
    body.light .contextMenu button{color:#26324f}
    body.light .contextMenu button:hover{background:#eef3ff}
    html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif;user-select:none}
    body{display:flex;flex-direction:column}
    header{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(180deg,#11162b,#0b0f1d);border-bottom:1px solid var(--line);z-index:10;flex-shrink:0}
    .logo{font-weight:900;letter-spacing:-.04em;font-size:19px;color:var(--bright);white-space:nowrap}
    .logo b{color:var(--blue)}
    .tag{display:flex;align-items:center;gap:8px;border:1px solid rgba(61,111,255,.25);background:rgba(61,111,255,.09);color:#9eb6ff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
    .tag:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
    .header-actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}
    .header-actions::-webkit-scrollbar{display:none}
    button{font:inherit} input,textarea,select{user-select:text}
    .hbtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:6px 9px;cursor:pointer;font-weight:800;font-size:11.5px;transition:.15s;white-space:nowrap}
    .hbtn:hover{border-color:var(--blue);color:var(--bright);transform:translateY(-1px)}
    .hbtn .islot svg{stroke:currentColor}
    .hbtn.danger:hover{border-color:var(--red);color:#ff8a8a;background:rgba(239,68,68,.08)}
    .hbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}

    #app{--leftW:280px;--codeW:390px;flex:1;min-height:0;display:grid;grid-template-columns:var(--leftW) 6px minmax(180px,1fr) 6px var(--codeW);background:var(--bg)}
    aside,#codePanel{background:var(--panel);border-color:var(--line);min-width:0;display:flex;flex-direction:column}
    aside{position:relative;min-height:0;overflow:hidden;border-right:1px solid var(--line)}
    aside.deleteTarget{outline:2px dashed var(--red);outline-offset:-8px;background:linear-gradient(180deg,rgba(239,68,68,.12),var(--panel))}
    aside.deleteTarget:after{content:attr(data-delete-text);position:absolute;left:14px;right:14px;bottom:14px;text-align:center;color:#ff9a9a;border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.12);border-radius:12px;padding:10px;font-weight:900;font-size:12px}
    #codePanel{border-left:1px solid var(--line);position:relative;z-index:6;min-height:0;overflow:hidden}
    .vResize{background:var(--line);cursor:col-resize;position:relative;z-index:8}
    .vResize:hover,.vResize.active{background:var(--blue)}
    .vResize:after{content:'';position:absolute;top:50%;left:50%;width:2px;height:42px;border-radius:2px;background:rgba(255,255,255,.22);transform:translate(-50%,-50%)}
    #tabResize{height:6px;flex-shrink:0;background:var(--line);cursor:row-resize;position:relative}
    #tabResize:hover,#tabResize.active{background:var(--blue)}
    #tabResize:after{content:'';position:absolute;left:50%;top:50%;width:42px;height:2px;border-radius:2px;background:rgba(255,255,255,.22);transform:translate(-50%,-50%)}
    .tabs{height:58px;flex-shrink:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:8px;border-bottom:1px solid var(--line);overflow-y:auto;overflow-x:hidden;background:var(--panel2);scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
    .tabs::-webkit-scrollbar{width:6px}.tabs::-webkit-scrollbar-track{background:transparent}.tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
    .tab{width:48px;height:48px;flex:0 0 48px;border:0;background:transparent;color:var(--muted);border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;font-weight:900;transition:.15s;position:relative}
    .ico{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:0}
    .svgIco{display:block;flex-shrink:0;overflow:visible}
    svg{display:block}
    .islot{display:inline-flex;align-items:center;justify-content:center;line-height:0;flex-shrink:0}
    .hbtn .islot{margin-right:1px}
    .hbtn.iconOnly{padding:6px 8px}
    .hbtn.active{border-color:var(--blue);color:var(--bright);background:rgba(61,111,255,.14)}
    .tab .ico{transition:.15s;color:var(--muted)}
    .tab:hover{color:var(--bright);background:rgba(255,255,255,.045)}
    .tab:hover .ico{color:var(--text)}
    .tab.active{color:var(--bright);background:rgba(255,255,255,.045)}
    .tab.active:after{content:"";position:absolute;bottom:3px;width:22px;height:3px;background:var(--cat);border-radius:3px}
    .tab.active .ico{color:var(--cat)}
    #palette{padding:12px;overflow:auto;min-height:0;flex:1;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
    #palette::-webkit-scrollbar{width:6px}#palette::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
    .catTitle .titleIco{display:inline-flex;color:var(--cat)}
    .catTitle{display:flex;align-items:center;gap:8px;color:var(--cat);text-transform:uppercase;font-size:12px;font-weight:900;letter-spacing:.1em;margin:4px 2px 12px}
    .tool{display:flex;align-items:center;gap:9px;width:100%;background:linear-gradient(180deg,var(--panel2),#0f1428);border:1px solid var(--line);border-left:4px solid var(--cat);color:var(--bright);border-radius:11px;padding:9px 11px;margin-bottom:8px;cursor:grab;user-select:none;box-shadow:0 5px 18px rgba(0,0,0,.14);transition:.15s;text-align:left}
    .tool:hover{border-color:var(--cat);transform:translateX(3px);background:var(--panel3)}
    .tool:active{cursor:grabbing}
    .tool .name{font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;font-weight:800;word-break:break-word}
    .tool .desc{display:block;color:var(--muted);font-family:inherit;font-weight:700;font-size:10px;margin-top:2px;line-height:1.35}
    .tool .ico{color:var(--cat);opacity:.95}
    .tool.valueTool{border-radius:999px;width:max-content;max-width:100%;padding:8px 12px}
    .tool.valueTool .desc{display:none}
    .specialBtn{display:flex;align-items:center;gap:8px;border:1px dashed rgba(255,255,255,.18);background:rgba(255,255,255,.035);color:var(--bright);border-radius:12px;padding:10px;margin-bottom:12px;cursor:pointer;font-weight:900;width:100%;text-align:left;font-size:11.5px}
    .specialBtn:hover{border-color:var(--cat);background:rgba(255,255,255,.06)}
        .chip{display:inline-flex;align-items:center;border-radius:999px;background:var(--blue);color:white;padding:3px 8px;font-family:"JetBrains Mono",Consolas,monospace;font-size:11px;font-weight:800}
    .kind{font-family:"JetBrains Mono",Consolas,monospace;font-size:10px;color:var(--yellow);border:1px solid rgba(251,191,36,.3);border-radius:6px;padding:2px 5px}

    main{min-width:0;display:flex;flex-direction:column;background:radial-gradient(circle at 20% 15%,rgba(61,111,255,.12),transparent 28%),var(--bg);overflow:visible;position:relative}
    .workspaceTop{height:42px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:rgba(13,17,34,.8);backdrop-filter:blur(10px);white-space:nowrap;overflow:visible;min-width:max-content;position:relative;z-index:1}
    .workspaceTop>*{flex-shrink:0}
    .workspaceTop h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
    .count{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:900;color:var(--muted)}
    .count.over{border-color:var(--red);color:#ff9a9a;background:rgba(239,68,68,.12)}
    .hint{margin-left:auto;color:var(--dim);font-size:11.5px;font-weight:700}
    .hint.hidden{display:none}
    .hintClose{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:7px;width:23px;height:23px;cursor:pointer;font-weight:900;line-height:1}
    .hintClose:hover{border-color:var(--red);color:var(--red)}
    .kbd{border:1px solid var(--line);background:var(--panel2);border-radius:5px;padding:1px 5px;font-family:Consolas,monospace;font-size:10.5px;color:var(--text)}
    #workspace{position:relative;flex:1;overflow:hidden;background-image:radial-gradient(circle,#202949 1px,transparent 1px);background-size:24px 24px;cursor:grab;touch-action:none}
    #workspace.panning{cursor:grabbing}
    .canvas{position:absolute;left:0;top:0;width:3600px;min-height:2600px;padding:28px;transform-origin:0 0;will-change:transform}
    .viewControls{display:flex;align-items:center;gap:5px;margin-left:6px}
    .zoomBadge{min-width:46px;text-align:center;color:var(--muted);font-family:Consolas,monospace;font-size:11px;font-weight:900;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:4px 6px}
    .iconBtn{width:27px;height:27px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;cursor:pointer;font-weight:900;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
    .iconBtn:hover{border-color:var(--blue);color:var(--bright)}
    .empty{position:absolute;left:28px;top:28px;width:min(560px,92%);padding:26px;border:2px dashed rgba(61,111,255,.28);border-radius:20px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);background:rgba(13,17,34,.45);text-align:center}
    .empty strong{font-size:18px;color:var(--bright)}
    .dropzone{height:14px;border-radius:8px;margin:1px 0;transition:.12s;position:relative;min-width:220px}
    .dropzone.dragover{height:40px;border:2px dashed var(--blue);background:rgba(61,111,255,.08)}
    .dropzone.local{cursor:copy}
    .stackWrap{position:absolute}
    .stackWrap .stackBar{display:flex;align-items:center;gap:6px;height:20px;opacity:0;transition:.15s;font-size:10px;font-weight:900;color:var(--dim);font-family:Consolas,monospace;cursor:grab}
    .stackWrap:hover .stackBar{opacity:1}
    .stackWrap.hasHat .stackBar{display:none}
    .block{position:relative;display:table;width:max-content;min-width:220px;max-width:none;border:1px solid color-mix(in srgb,var(--bc) 35%,var(--line));background:linear-gradient(180deg,#11172d,#0c1020);border-radius:12px;margin:0;box-shadow:0 12px 32px rgba(0,0,0,.18);overflow:hidden}
    .block.dragging{opacity:.35}
    .block.disabled{opacity:.45;filter:grayscale(.7)}
    .block.collapsed .body{display:none}
    .block:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--bc)}
    .blockHead{min-height:44px;display:flex;align-items:center;gap:6px;padding:7px 10px 7px 13px}
    .blockHead.hat{border-radius:12px 12px 0 0;padding-top:10px;padding-bottom:12px}
    .handle{color:var(--dim);cursor:grab;font-size:15px;line-height:1;padding:0 2px}
    .blockTag{font-size:9.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--bc);border:1px solid color-mix(in srgb,var(--bc) 40%,transparent);border-radius:5px;padding:1px 4px;flex-shrink:0}
    .codeMini{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;white-space:nowrap;font-family:"JetBrains Mono",Consolas,monospace;font-size:12.5px;color:#E5E5E5;line-height:1.75;flex:1}
    .inp,.sel{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:7px;color:#c3e88d;font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;padding:3px 6px;outline:0;min-width:60px;max-width:none}
    .sel{color:#ff9d6c;cursor:pointer;max-width:230px}
    .inp:focus,.sel:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,111,255,.14)}
    .valueSlot{display:inline-flex;align-items:center;gap:3px;min-width:54px;min-height:23px;border:1px solid rgba(255,255,255,.10);border-radius:7px;background:rgba(255,255,255,.03);padding:1px 3px;vertical-align:middle;transition:.12s}
    .valueSlot.dragover{border-color:var(--blue);background:rgba(61,111,255,.14);box-shadow:0 0 0 3px rgba(61,111,255,.12)}
    .valueSlot .slotInput{border:0;background:transparent;color:#c3e88d;font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;outline:0;padding:2px 3px;min-width:44px}
    .valueBlock{display:inline-flex;align-items:center;gap:4px;border:1px solid color-mix(in srgb,var(--bc,var(--blue)) 45%,var(--line));background:rgba(61,111,255,.07);border-radius:8px;padding:2px 5px;white-space:nowrap}
    .valueBlock.obj{background:rgba(167,139,250,.09)}
    .valueBlock.list{background:rgba(34,197,94,.09)}
    .valueItem{display:inline-flex;align-items:center;gap:3px}
    .keyInput{min-width:48px}
    .valueAdd{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:5px;width:17px;height:17px;cursor:pointer;font-weight:900;line-height:1;font-size:11px;padding:0}
    .valueAdd:hover{color:var(--green);border-color:var(--green)}
    .valueRemove{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:11px;padding:0 1px;line-height:1}
    .valueRemove:hover{color:var(--red)}
    .body{margin:0 10px 10px 26px;border-left:2px solid color-mix(in srgb,var(--bc) 45%,transparent);border-bottom:2px solid color-mix(in srgb,var(--bc) 35%,transparent);border-radius:0 0 0 10px;padding:6px 0 6px 14px;min-height:44px;min-width:200px}
    .body .dropzone{margin-right:10px}
    .bodyEmpty{color:var(--dim);font-size:11.5px;font-weight:800;padding:8px 0 10px}
    .closeBrace{font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;color:var(--dim);padding:0 0 4px 2px}
    .miniBtn{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:6px;cursor:pointer;font-size:10px;font-weight:900;padding:2px 5px;line-height:1.2}
    .miniBtn:hover{color:var(--bright);border-color:var(--blue)}
    .hatBadge{font-size:9.5px;font-weight:900;color:#0b0f1d;background:var(--bc);border-radius:999px;padding:1px 6px;letter-spacing:.04em}

    .codeTop{min-height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
    .codeTop .label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}
    .badge{background:rgba(61,111,255,.15);border:1px solid rgba(61,111,255,.35);color:#9eb6ff;border-radius:6px;padding:2px 6px;font-size:10.5px;font-weight:900}
    .badge.warn{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#ff9a9a}
    .codeStat{font-family:Consolas,monospace;font-size:10.5px;color:var(--dim);font-weight:800}
    .codeStat.over{color:#ff9a9a}
    #code{flex:1;min-height:0;overflow:auto;padding:10px 0 20px;background:#080b16;scrollbar-width:thin;scrollbar-color:var(--muted) transparent;overscroll-behavior:contain;font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;line-height:1.6;user-select:text}
    #code::-webkit-scrollbar{width:8px;height:8px}
    #code::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
    #code.wrap .line{white-space:pre-wrap;word-break:break-word}
    #code .line{display:flex;white-space:pre;min-height:19px}
    #code .line:hover{background:rgba(255,255,255,.03)}
    #code .ln{width:34px;flex-shrink:0;text-align:right;padding-right:10px;color:#3b4569;user-select:none;font-size:10.5px;line-height:19px}
    #code .txt{white-space:inherit;padding-right:14px;color:#E5E5E5}

    .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:60}
    .box{width:min(520px,calc(100vw - 30px));max-height:86vh;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 26px 80px rgba(0,0,0,.65)}
    .box h3{color:var(--bright);margin-bottom:6px;font-size:17px}
    .box .sub{color:var(--muted);font-size:12px;margin-bottom:14px;line-height:1.5}
    .field{display:flex;flex-direction:column;gap:5px;margin:10px 0}
    .field label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .field input,.field select,.field textarea{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--text);font-family:inherit;font-size:13px;outline:0;width:100%}
    .field textarea{min-height:120px;font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;resize:vertical}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
    .modalActions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .btnPrimary{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--blue);border:1px solid var(--blue);color:#fff;border-radius:9px;padding:8px 16px;font-weight:900;cursor:pointer;font-size:12.5px}
    .btnPrimary svg{stroke:#fff}
    .btnPrimary:hover{filter:brightness(1.12)}
    .btnGhost{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 14px;font-weight:900;cursor:pointer;font-size:12.5px}
    .btnGhost:hover{border-color:var(--blue);color:var(--bright)}
    .listRow{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:rgba(255,255,255,.02)}
    .listRow .nm{font-family:Consolas,monospace;font-size:12.5px;color:var(--bright);flex:1;word-break:break-all}
    .listRow .meta{font-size:10px;color:var(--dim);font-weight:900;text-transform:uppercase}

    .listRow button:hover{color:var(--red);border-color:var(--red)}
    .contextMenu{position:fixed;z-index:70;background:var(--panel3);border:1px solid var(--line);border-radius:11px;padding:5px;box-shadow:0 20px 50px rgba(0,0,0,.6);min-width:186px}
    .contextMenu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--text);padding:7px 9px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;text-align:left}
    .contextMenu button:hover{background:rgba(61,111,255,.16)}
    .contextMenu button.danger:hover{background:rgba(239,68,68,.16);color:#ff9a9a}
    .contextMenu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
    .contextMenu .cKey{margin-left:auto;font-size:10px;color:var(--dim);font-family:Consolas,monospace}
    .contextMenu .cmIco{display:inline-flex;width:14px;color:var(--muted)}
    .contextMenu button:hover .cmIco{color:var(--bright)}
    .valueRemove svg{stroke:currentColor}
    .grip{display:inline-flex;opacity:.5}
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line);color:var(--bright);border-radius:11px;padding:10px 16px;font-size:12.5px;font-weight:800;z-index:90;box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:0;transition:.2s;pointer-events:none}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
    .toast.err{border-color:rgba(239,68,68,.5);color:#ff9a9a}
    .tmplGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
    .tmplCard{border:1px solid var(--line);border-radius:11px;padding:10px;background:rgba(255,255,255,.02);cursor:pointer;text-align:left}
    .tmplCard:hover{border-color:var(--blue);background:rgba(61,111,255,.08)}
    .tmplCard .tName{font-weight:900;font-size:12.5px;color:var(--bright);margin-bottom:3px}
    .tmplCard .tDesc{font-size:10.5px;color:var(--muted);line-height:1.35}
    @media(max-width:1420px){header .tag{display:none}}
    @media(max-width:1180px){header .hbtn span[data-i18n="exportBtn"],header .hbtn span[data-i18n="importBtn"],header .hbtn span[data-i18n="newProject"]{display:none}}
    @media(max-width:1020px){header .hbtn span[data-i18n="load"],header .hbtn span[data-i18n="templates"],header .hbtn span[data-i18n="clear"]{display:none}}
    @media(max-width:1050px){#app{--leftW:230px;--codeW:330px}.hint{display:none}}
    @media(max-width:820px){#app{grid-template-columns:1fr}.vResize,aside,#codePanel{display:none}}


    /* ---------- Typed modules (small nested value blocks) ---------- */
    .modBlock{display:inline-flex;flex-direction:column;gap:3px;vertical-align:top;
      border:1px solid rgba(199,146,234,.42);border-left:3px solid #c792ea;
      background:rgba(199,146,234,.07);border-radius:8px;padding:4px 6px;margin:1px 2px;
      font-family:"JetBrains Mono",Consolas,monospace;font-size:11px;max-width:100%}
    body.light .modBlock{background:rgba(124,58,237,.06);border-color:rgba(124,58,237,.3)}
    .modBlock.mod-fx{border-left-color:#f2c98a;border-color:rgba(242,201,138,.4);background:rgba(242,201,138,.06)}
    .modBlock.mod-mesh{border-left-color:#89ddff;border-color:rgba(137,221,255,.4);background:rgba(137,221,255,.06)}
    .modBlock.mod-world{border-left-color:#a3e635;border-color:rgba(163,230,53,.4);background:rgba(163,230,53,.06)}
    .modBlock.mod-game{border-left-color:#f78c6c;border-color:rgba(247,140,108,.4);background:rgba(247,140,108,.06)}
    .modBlock.mod-item{border-left-color:#ffcb6b;border-color:rgba(255,203,107,.4);background:rgba(255,203,107,.06)}
    .modHead{display:inline-flex;align-items:center;gap:5px;color:#e2c8ff;font-weight:800;font-size:9.5px;
      letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
    .modBlock.mod-fx .modHead{color:#f7d9a8}
    .modBlock.mod-mesh .modHead{color:#b5e9ff}
    .modBlock.mod-world .modHead{color:#cdf08a}
    .modBlock.mod-game .modHead{color:#ffb49a}
    .modBlock.mod-item .modHead{color:#ffe0a3}
    .modHead svg{opacity:.85}
    .modFields,.modList{display:flex;flex-direction:column;gap:3px;min-width:0}
    .modRow{display:flex;align-items:center;gap:5px;min-width:0;flex-wrap:wrap}
    .modKey{color:#8b98b8;font-size:10px;min-width:0;flex-shrink:0}
    .modKey:after{content:":";margin-left:1px}
    .modInput{min-width:44px;max-width:210px}
    .modPick{background:rgba(255,255,255,.05);color:#c3e88d;border:1px solid var(--line);
      border-radius:5px;font-family:inherit;font-size:10.5px;padding:1px 3px;max-width:170px}
    body.light .modPick{background:#fff;color:#3f6212}
    .modAdd,.modBlock .valueAdd{width:18px;height:18px;border-radius:5px;border:1px dashed rgba(199,146,234,.5);
      background:transparent;color:#c792ea;cursor:pointer;font-weight:900;line-height:1;padding:0}
    .modAdd:hover,.modBlock .valueAdd:hover{background:rgba(199,146,234,.18)}
    .modBlock .valueRemove{color:#c792ea}
    /* chip shown before a module is expanded inside a normal slot */
    .modChip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;
      background:rgba(199,146,234,.16);border:1px solid rgba(199,146,234,.42);color:#e2c8ff;
      font-family:"JetBrains Mono",Consolas,monospace;font-size:11px;font-weight:700}


    .modBadge{display:inline-block;margin-left:6px;padding:1px 5px;border-radius:4px;font-size:8px;
      letter-spacing:.08em;text-transform:uppercase;font-weight:900;color:#c792ea;
      border:1px solid rgba(199,146,234,.45);background:rgba(199,146,234,.12);vertical-align:middle}

    /* ---------- Autocomplete popup ---------- */
    .acPopup{position:fixed;z-index:9999;display:none;min-width:190px;max-width:min(460px,92vw);overflow:auto;
      background:var(--panel2);border:1px solid var(--line);border-radius:11px;
      box-shadow:0 18px 44px rgba(0,0,0,.55);padding:4px;font-family:"JetBrains Mono",Consolas,monospace}

      color:var(--dim);background:inherit;font-family:inherit;font-weight:800}
    .acItem{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--text);
      text-align:left;padding:5px 7px;border-radius:7px;cursor:pointer;font:inherit;font-size:11.5px;line-height:1.25}
    .acItem:hover,.acItem.sel{background:rgba(61,111,255,.18);color:var(--bright)}

    .acVal{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acKind{flex-shrink:0;font-size:8.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
      padding:2px 5px;border-radius:5px;border:1px solid var(--line);color:var(--dim);max-width:96px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acKind.ac-enum{color:#7dd3fc;border-color:rgba(125,211,252,.35)}

    .acKind.ac-template,.acKind.ac-objectKey{color:#c792ea;border-color:rgba(199,146,234,.35)}

    .acKind.ac-keyword{color:#8b98b8;border-color:rgba(139,152,184,.35)}
    .acKind.ac-number,.acKind.ac-bool{color:#f2c98a;border-color:rgba(242,201,138,.35)}
    .acKind.ac-member{color:#a3e635;border-color:rgba(163,230,53,.35)}
    .acKind.ac-identifier{color:#e0e7f5;border-color:rgba(224,231,245,.3)}
    @media(max-width:760px){.acPopup{max-width:94vw}}

/* ---------- runtime ---------- */
function modNew(modId){
  const m=MODULES[modId];
  const v={__mod:modId,f:{}};
  (m.fields||[]).forEach(([key,type,def])=>{
    if(type.indexOf('mod:')===0){v.f[key]=modNew(type.slice(4));return}
    v.f[key]=def;
  });
  return modEnsureParents({__mod:modId,f:v.f});
}
/* a new element for a list module: raw strings are the cheapest useful default */
function modNewElement(modId){
  if(modId==='raw')return '"texte"';
  return modNew(modId);
}
function modIsValue(v){return !!(v&&typeof v==='object'&&v.__mod&&MODULES[v.__mod])}
/* code for one module value */
function modCode(v,ind){
  ind=ind||'';
  if(v===null||v===undefined)return 'null';
  if(typeof v==='string'||typeof v==='number'||typeof v==='boolean')return modScalar(v);
  const m=MODULES[v.__mod];
  if(!m)return 'null';
  if(m.listOf){
    const items=v.elements||[];
    if(!items.length)return '[]';
    return (m.hint&&m.hint.left||'[')+'\n'+items.map((e,i)=>ind+'  '+modElementCode(e,ind+'  ')+(i<items.length-1?',':'')).join('\n')+'\n'+ind+(m.hint&&m.hint.right||']');
  }
  /* group flat dotted keys back into their nested object: style.color -> style: { color } */
  const top=[],groups={};
  (m.fields||[]).forEach(([key,type,def])=>{
    if((m.optional||[]).includes(key)&&!modHas(v,key))return;
    const dot=key.indexOf('.');
    if(dot<0){top.push([key,modFieldCode(modGet(v,key),type)]);return}
    const a=key.slice(0,dot),b=key.slice(dot+1);
    (groups[a]=groups[a]||[]).push([b,modFieldCode(modGet(v,key),type)]);
  });
  Object.keys(groups).forEach(a=>{
    const inner=groups[a].map(([k,val])=>k+': '+val).join(', ');
    if(inner)top.push([a,'{ '+inner+' }']);
  });
  if(m.extra&&modHas(v,m.extra[0]))top.push([m.extra[0],modScalar(modGet(v,m.extra[0]))]);
  if(!top.length)return '{}';
  return '{\n'+top.map(([k,val])=>ind+'  '+k+': '+val).join(',\n')+'\n'+ind+'}';
}
function modElementCode(e,ind){
  if(typeof e==='string')return modScalar(e);
  if(modIsValue(e))return modCode(e,ind);
  return modScalar(String(e));
}
function modFieldCode(val,type){
  if(type==='vec'||type==='rgba')return String(val||'[0, 0, 0]');
  if(type==='raw')return String(val==null?'null':val);
  if(type.indexOf('mod:')===0)return modIsValue(val)?modCode(val):'null';
  return modScalar(val);
}
function modScalar(v){
  if(v===null||v===undefined)return 'null';
  if(typeof v==='boolean'||typeof v==='number')return String(v);
  const s=String(v).trim();
  if(!s)return '""';
  if(/^([\[\{]|true$|false$|null$|-?\d+(\.\d+)?$)/.test(s))return s;
  if(/^(["'`]).*\1$/s.test(s))return s;
  if(/^[A-Za-z_$][\w$.]*$/.test(s)&&/^(playerId|entityId|myId|api\.|thisPos)/.test(s))return s;
  return '"'+s.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
}
/* dotted key access so style.color can live in one flat object */
function modGet(v,key){
  if(key.indexOf('.')<0)return v.f[key];
  const [a,b]=key.split('.');
  const st=v.f[a]&&typeof v.f[a]==='object'?v.f[a]:null;
  return st?st[b]:undefined;
}
function modSet(v,key,val){
  if(key.indexOf('.')<0){v.f[key]=val;return}
  const [a,b]=key.split('.');
  if(!v.f[a]||typeof v.f[a]!=='object')v.f[a]={};
  v.f[a][b]=val;
}
/* make sure every dotted parent exists before the editor reads it */
function modEnsureParents(v){
  const m=MODULES[v.__mod];
  if(!m||!m.fields)return v;
  m.fields.forEach(([key])=>{
    if(key.indexOf('.')<0)return;
    const a=key.split('.')[0];
    if(!v.f[a]||typeof v.f[a]!=='object')v.f[a]={};
  });
  return v;
}
function modHas(v,key){
  if(key.indexOf('.')<0)return v.f[key]!==undefined&&v.f[key]!==null&&v.f[key]!=='';
  const val=modGet(v,key);
  return val!==undefined&&val!==null&&val!=='';
}
function modDel(v,key){
  if(key.indexOf('.')<0){delete v.f[key];return}
  const [a,b]=key.split('.');
  if(v.f[a]&&typeof v.f[a]==='object'){delete v.f[a][b];if(!Object.keys(v.f[a]).length)delete v.f[a]}
}


/* ============================================================
   Module compatibility — which typed modules may sit in which slot
   ============================================================ */

/* param names that hold rich text */
const MOD_TEXT_PARAMS=/^(text|message|title|subtext|label|content|requestText|displayName|reason|info|desc|description|customDisplayName|customDescription|middleText|headerText|chatText|playerName|killerName|body|prompt|notice)$/i;
/* param name pattern -> module ids accepted */
const MOD_PARAM_RULES=[
  [/^style$/i,                    ['styledText','styledIcon','entityName','translatedText','customTextStyling']],
  [/^posSettings$/i,              ['posSettings']],
  [/^nodeScales$/i,               ['meshScalingMap']],
  [/^item$/i,                     ['itemAttributes','shopItem']],
  [/^customAttributes$|^attributes$/i,['itemAttributes']],
  [/^physicsOptions$|^opts$/i,    ['particleOptions']],
  [/^updates$/i,                  ['particleOptions']],
  [/^particleOptions$/i,          ['particleOptions']],
  [/^colour$|^color$/i,           ['styledText']],
];
/* whole blocks whose specific params are typed */
const MOD_BLOCK_RULES={
  playParticleEffect:{0:['particleOptions']},
  attemptCreateMeshEntity:{3:['meshScalingMap']},
  setClientOption:  {2:['customTextStyling','styledText','styledIcon','entityName','translatedText']},
  setClientOptions: {1:['customTextStyling']},
  sendMessage:      {1:['customTextStyling','styledText','entityName','translatedText']},
  broadcastMessage: {0:['customTextStyling','styledText','entityName','translatedText']},
  attemptCreateAudioEntity:{5:['posSettings']},
  playSound:        {4:['posSettings']},
  broadcastSound:   {3:['posSettings']},
  configureShopItem:{2:['shopItem']},
  addShopItem:      {1:['shopItem']},
  updateShopItem:   {2:['shopItem']},
};
/* ids of the modules a slot accepts; null means "no module allowed" */
function modAllowedIn(b,idx){
  if(!b)return null;
  const d=defs[b.type]||{};
  const pname=(d.paramNames&&d.paramNames[idx])||'';
  const br=MOD_BLOCK_RULES[b.type];
  if(br&&br[idx])return br[idx].slice();
  for(const rule of MOD_PARAM_RULES){
    if(rule[0].test(pname))return rule[1].slice();
  }
  if(MOD_TEXT_PARAMS.test(pname))return ['customTextStyling','styledText','styledIcon','entityName','translatedText'];
  return null;
}
function modFitsSlot(id,b,idx){
  const allowed=modAllowedIn(b,idx);
  return !!allowed&&allowed.indexOf(id)>=0;
}
function modSlotLabel(b,idx){
  const allowed=modAllowedIn(b,idx);
  if(!allowed)return null;
  return allowed.map(id=>modLabel(id,LANG())).join(', ');
}
function modElementAllowed(listId,childId){
  const m=MODULES[listId];
  if(!m||!m.listOf)return false;
  return (m.of||[]).indexOf(childId)>=0;
}

/* ============================================================
   Module editor — renders a module value as a small nested block
   ============================================================ */
function modLabel(modId,lang){
  const m=MODULES[modId];
  if(!m)return modId;
  const l=m.label;
  return typeof l==='string'?l:(l[lang]||l.en||l.fr||modId);
}
function modDescOf(modId,lang){
  const m=MODULES[modId];
  if(!m)return '';
  const d=m.desc;
  return typeof d==='string'?d:(d[lang]||d.en||d.fr||'');
}
/* short preview shown on the collapsed chip */
function modPreview(v){
  if(typeof v!=='object'||!v)return String(v);
  const m=MODULES[v.__mod];
  if(!m)return '?';
  if(m.listOf){
    const n=(v.elements||[]).length;
    return n?modLabel(v.__mod,LANG())+' · '+n:n?String(n):'[]';
  }
  if(v.__mod==='styledText')return String(modGet(v,'str')||'""');
  if(v.__mod==='styledIcon')return String(modGet(v,'icon')||'"icon"');
  if(v.__mod==='entityName')return String(modGet(v,'entityName')||'"name"');
  if(v.__mod==='translatedText')return String(modGet(v,'translationKey')||'"key"');
  return modLabel(v.__mod,LANG());
}
function LANG(){return (typeof lang!=='undefined'&&lang)||'en'}

/* the editor widget */
function moduleEditor(v,setter){
  const wrap=document.createElement('span');
  wrap.className='modBlock mod-'+((MODULES[v.__mod]||{}).cat||'text');
  render();
  function update(){setter(v)}
  function render(){
    wrap.innerHTML='';
    const m=MODULES[v.__mod];
    if(!m)return;
    const head=document.createElement('span');
    head.className='modHead';
    head.innerHTML=icon(m.icon||'puzzle',12)+'<span class="modName">'+esc(modLabel(v.__mod,LANG()))+'</span>';
    head.title=modDescOf(v.__mod,LANG());
    wrap.append(head);

    if(m.listOf){
      /* array of parts: each element is either raw text or a nested module */
      const body=document.createElement('span');
      body.className='modList';
      (v.elements||[]).forEach((el,i)=>{
        const row=document.createElement('span');
        row.className='modRow';
        const picker=document.createElement('select');
        picker.className='modPick';
        m.of.forEach(id=>{
          const o=document.createElement('option');
          o.value=id;o.textContent=id==='raw'?(LANG()==='fr'?'texte':'text'):modLabel(id,LANG());
          picker.append(o);
        });
        picker.value=typeof el==='string'?'raw':el.__mod;
        picker.onchange=()=>{
          v.elements[i]=picker.value==='raw'?'"texte"':modNew(picker.value);
          update();render();
        };
        picker.onmousedown=e=>e.stopPropagation();
        row.append(picker);
        if(typeof el==='string'){
          const inp=document.createElement('input');
          inp.className='slotInput modInput';
          inp.value=el;
          inp.placeholder='"texte"';
          inp.size=Math.max(6,Math.min(30,String(el).length||6));
          inp.oninput=()=>{v.elements[i]=inp.value;update()};
          inp.onmousedown=e=>e.stopPropagation();
          acAttach(inp,()=>null,()=>0,val=>{v.elements[i]=val});
          row.append(inp);
        }else if(modIsValue(el)){
          row.append(moduleEditor(el,()=>update()));
        }
        const rm=document.createElement('button');
        rm.className='valueRemove';rm.innerHTML=icon('close',10);rm.title=tr('delete');
        rm.onclick=e=>{e.stopPropagation();v.elements.splice(i,1);update();render()};
        row.append(rm);
        body.append(row);
      });
      const add=document.createElement('button');
      add.className='valueAdd modAdd';add.textContent='+';
      add.title=LANG()==='fr'?'Ajouter une partie':'Add a part';
      add.onclick=e=>{
        e.stopPropagation();
        v.elements=(v.elements||[]);
        v.elements.push(modNewElement(m.of[0]));
        update();render();
      };
      wrap.append(body,add);
      return;
    }

    /* object-shaped module: one row per field */
    const body=document.createElement('span');
    body.className='modFields';
    (m.fields||[]).forEach(([key,type,def])=>{
      const opt=(m.optional||[]).includes(key);
      const present=opt?modHas(v,key):true;
      if(opt&&!present)return;
      const row=document.createElement('span');
      row.className='modRow';
      const k=document.createElement('span');
      k.className='modKey';
      k.textContent=key.split('.').pop();
      row.append(k);
      row.append(modFieldInput(v,key,type,()=>{update()},()=>render()));
      if(opt){
        const rm=document.createElement('button');
        rm.className='valueRemove';rm.innerHTML=icon('close',10);rm.title=tr('delete');
        rm.onclick=e=>{e.stopPropagation();modDel(v,key);update();render()};
        row.append(rm);
      }
      body.append(row);
    });
    wrap.append(body);
    /* optional fields that are not shown yet */
    const hidden=(m.optional||[]).filter(k=>!modHas(v,k));
    if(hidden.length||(m.extra&&!modHas(v,m.extra[0]))){
      const add=document.createElement('button');
      add.className='valueAdd modAdd';add.textContent='+';
      add.title=LANG()==='fr'?'Ajouter un champ':'Add a field';
      add.onclick=e=>{
        e.stopPropagation();
        modAddMenu(v,hidden,m,(k)=>{update();render()});
      };
      wrap.append(add);
    }
  }
  return wrap;
}
/* the input for one field, dispatched on its type */
function modFieldInput(v,key,type,changed,rerender){
  if(type.indexOf('mod:')===0){
    const kid=type.slice(4);
    if(!modIsValue(modGet(v,key)))modSet(v,key,modNew(kid));
    return moduleEditor(modGet(v,key),()=>changed());
  }
  const enumList=MOD_ENUMS[type];
  if(enumList&&enumList.length){
    const sel=document.createElement('select');
    sel.className='modPick';
    enumList.forEach(val=>{
      const o=document.createElement('option');o.value=val;o.textContent=val.replace(/^"|"$/g,'');sel.append(o);
    });
    const cur=String(modGet(v,key)==null?'':modGet(v,key));
    if(cur&&!enumList.includes(cur)){const o=document.createElement('option');o.value=cur;o.textContent=cur;sel.append(o)}
    sel.value=cur||enumList[0];
    if(!cur)modSet(v,key,enumList[0]);
    sel.onchange=()=>{modSet(v,key,sel.value);changed()};
    sel.onmousedown=e=>e.stopPropagation();
    return sel;
  }
  const inp=document.createElement('input');
  inp.className='slotInput modInput';
  inp.value=String(modGet(v,key)==null?'':modGet(v,key));
  inp.size=Math.max(6,Math.min(28,String(inp.value).length||6));
  inp.oninput=()=>{modSet(v,key,inp.value);changed()};
  inp.onmousedown=e=>e.stopPropagation();
  if(MOD_ENUMS[type]&&MOD_ENUMS[type].length)inp.dataset.modEnum=type;
  acAttach(inp,()=>null,()=>0,val=>{modSet(v,key,val);changed()});
  return inp;
}
/* menu of the optional fields that can still be added */
function modAddMenu(v,hidden,m,after){
  $$('.contextMenu').forEach(e=>e.remove());
  const items=hidden.map(k=>{
    const f=(m.fields||[]).find(x=>x[0]===k);
    return {label:k,fn:()=>{modSet(v,k,f?f[2]:'""');after(k)}};
  });
  if(m.extra)items.push({label:m.extra[0],fn:()=>{modSet(v,m.extra[0],m.extra[2]||'""');after(m.extra[0])}});
  const r=document.activeElement&&document.activeElement.getBoundingClientRect?document.activeElement.getBoundingClientRect():{left:120,top:120,bottom:140};
  ctxMenu(items,r.left,r.bottom||r.top);
}

/* register every typed module as a droppable value block */
function registerModules(){
  Object.keys(MODULES).forEach(id=>{
    const m=MODULES[id];
    const key='mod_'+id;
    if(defs[key])return;
    defs[key]={cat:m.cat==='text'?'variables':(m.cat==='fx'?'variables':'variables'),
      icon:m.icon,module:id,valueOnly:true,valueKind:'module',
      label:modLabel(id,LANG()),
      desc:modDescOf(id,LANG()),
      params:[],snippet:modLabel(id,LANG()),
      hidden:false};
  });
}

function apiInline(name){return b=>[['prop','api'],['pun','.'],['fn',name],['pun','('],...b.params.flatMap((_,i)=> i<b.params.length-1 ? [['input',i],['pun',', ']] : [['input',i]]),['pun',')']]}
function apiInlineChoice(name){return b=>{const d=defOf(b.type),out=[['prop','api'],['pun','.'],['fn',name],['pun','(']];b.params.forEach((_,i)=>{out.push(d.choices&&d.choices[i]?['choice',i,d.choices[i]]:['input',i]);if(i<b.params.length-1)out.push(['pun',', '])});out.push(['pun',')']);return out}}
function apiExpr(name){return b=>'api.'+name+'('+b.params.map(fmt).join(', ')+')'}

function apiSnippetFor(m){return 'api.'+m.name+'('+m.params.map(p=>p.default).join(', ')+')'}
function registerApiMethods(methods){
  const seen=new Set();
  methods.forEach(m=>{
    if(seen.has(m.name))return;   // first registration wins: no duplicate blocks
    seen.add(m.name);
    defs[m.name]={cat:m.cat,icon:m.icon||'plug',label:'api.'+m.name,
      desc:m.desc||('api.'+m.name+'('+m.params.map(p=>p.name).join(', ')+')'+(m.returns?' -> '+m.returns:'')),
      params:m.params.map(p=>p.default),
      paramNames:m.params.map(p=>p.name),
      choices:m.params.map(p=>p.choice),
      inline:apiInlineChoice(m.name),
      expr:apiExpr(m.name),
      api:true,
      returns:m.returns||''};
  });
}
function registerApiValueSnippets(methods){
  methods.filter(m=>API_RETURN_NAMES.has(m.name)||/^get|^has|^is|^can|^find|^attempt|^calc/.test(m.name)).forEach(m=>{
    if(defs[m.name]&&!defs[m.name].valueOnly){defs[m.name].returnValue=true}
  });
}

const tr=k=>String(k).split('.').reduce((o,p)=>o&&o[p],I18N[lang])??k;

/* ============================================================
   Code generation helpers
   ============================================================ */
const isNested=v=>!!v&&typeof v==='object'&&typeof v.type==='string';
function isValueObj(v){return v&&typeof v==='object'&&(v.__value==='list'||v.__value==='object')}
function makeValue(kind){return kind==='object'?{__value:'object',props:[{key:'key1',value:'"value1"'}]}:{__value:'list',items:['"item1"']}}

function valueToCode(v){
  if(isValueObj(v)){
    if(v.__value==='list')return '['+v.items.map(x=>fmt(x)).join(', ')+']';
    return '{\n'+v.props.map(p=>'  '+String(p.key||'').trim()+': '+fmt(p.value)).join(',\n')+'\n}';
  }
  return fmt(v);
}
function fmt(v){
  if(isNested(v)){const d=defs[v.type];if(!d)return '""';return d.expr?d.expr(v):'""'}
  if(modIsValue(v))return modCode(v);
  if(isValueObj(v))return valueToCode(v);
  const s=String(v??'').trim();
  if(!s)return '""';
  if(/^(['"`]).*\1$/s.test(s))return s;
  if(/^(true|false|null|undefined|NaN|Infinity)$/.test(s))return s;
  if(/^-?\d+(\.\d+)?$/.test(s))return s;
  if(/^[a-zA-Z_$][\w$]*$/.test(s))return s;
  return s;
}
function parseArgs(s){return String(s||'').split(',').map(x=>x.trim()).filter(x=>/^[a-zA-Z_$][\w$]*$/.test(x))}
function parseCallArgs(s){return String(s||'').split(',').map(x=>x.trim()).filter(Boolean)}
function isIdentName(s){return /^[a-zA-Z_$][\w$]*$/.test(String(s||'').trim())}
function isArrayDestructure(s){s=String(s||'').trim();return /^\[\s*(?:\.\.\.)?[a-zA-Z_$][\w$]*(?:\s*,\s*(?:\.\.\.)?[a-zA-Z_$][\w$]*)*\s*\]$/.test(s)}
function isVarTarget(s){return isIdentName(s)||isArrayDestructure(s)}
function destructuredNames(s){const m=String(s||'').match(/[a-zA-Z_$][\w$]*/g);return m?m.filter(x=>x!=='let'&&x!=='const'&&x!=='var'):[]}
function objLiteral(s){
  const parts=parseCallArgs(s);
  if(!parts.length)return '{}';
  return '{\n'+parts.map(part=>{
    const i=part.indexOf(':');
    if(i<0)return '  '+part;
    const k=part.slice(0,i).trim(),v=part.slice(i+1).trim();
    return '  '+(isIdentName(k)?k:JSON.stringify(k))+': '+fmt(v);
  }).join(',\n')+'\n}';
}
function cleanFnName(n){
  n=String(n||'').trim();
  return /^[a-zA-Z_$][\w$]*$/.test(n)?n:tr('phFn').replace(/\s/g,'_');
}
function varLine(b,ctx,ind,value){
  const name=String(b.params[0]||'').trim();
  if(!isVarTarget(name))return ind+tr('invalidVar');
  const kind=['var','let','const'].includes(String(b.params[2]||'var'))?String(b.params[2]):'var';
  const names=destructuredNames(name);
  const declared=names.every(n=>ctx.has(n));
  if(kind==='var'){names.forEach(n=>ctx.add(n));return ind+name+' = '+value+';'}
  if(declared)return ind+name+' = '+value+';';
  names.forEach(n=>ctx.add(n));
  return ind+kind+' '+name+' = '+value+';';
}
function blockCode(b,ctx,ind){
  const d=defs[b.type];
  if(!d)return ind+'// unknown block';
  if(b.disabled)return ind+'// disabled: '+b.type;
  if(d.gen)return d.gen(b,ctx,ind);
  if(d.expr)return ind+d.expr(b)+';';
  return ind+'// '+b.type;
}
function genList(list,ctx,ind){
  if(!list||!list.length)return ind+'// '+tr('emptyBody');
  return list.map(b=>blockCode(b,ctx,ind)).join('\n');
}
function flatBlocks(list,out=[]){
  (list||[]).forEach(b=>{
    out.push(b);
    if(b.children)flatBlocks(b.children,out);
    if(b.children2)flatBlocks(b.children2,out);
    if(b.params)scanNested(b.params,bb=>out.push(bb));
  });
  return out;
}
function scanNested(arr,cb){
  (arr||[]).forEach(v=>{
    if(isNested(v)){cb(v);if(v.children)v.children.forEach(x=>cb(x));if(v.params)scanNested(v.params,cb)}
    else if(isValueObj(v)){
      (v.items||[]).forEach(x=>{if(isNested(x)){cb(x);if(x.params)scanNested(x.params,cb)}});
      (v.props||[]).forEach(p=>{if(isNested(p.value)){cb(p.value);if(p.value.params)scanNested(p.value.params,cb)}});
    }
  });
}
function allBlocks(){return stacks.flatMap(s=>flatBlocks(s.blocks,[]))}
function countBlocks(list){return (list||[]).reduce((a,b)=>a+1+(b.children?countBlocks(b.children):0)+(b.children2?countBlocks(b.children2):0),0)}
function totalBlocks(){return stacks.reduce((a,s)=>a+countBlocks(s.blocks),0)}

/* nested blocks inside value slots count for plugin detection */
function detectPlugins(){
  const need=new Set();
  allBlocks().forEach(b=>{const d=defs[b.type];if(d&&d.plugin)need.add(d.plugin)});
  return need;
}
const PLUGIN_EXPORTS={
  helpers:['setTimeout','setInterval','clearTimeout','clearInterval','forceLoadChunk','randomInt','shuffleArray','getRandomItem'],
  debug:['debugLog'],
  dialogue:['sayDialogue','clearDialogue'],
  sessionBasedGame:['createGame']
};
function buildImports(){
  const need=detectPlugins();
  const used=new Set();
  allBlocks().forEach(b=>{
    const d=defs[b.type];
    if(d&&d.plugin&&PLUGIN_EXPORTS[d.plugin]){
      if(b.type==='importHelpers')String(b.params[0]||'').split(',').forEach(x=>{if(x.trim())used.add(d.plugin+'|'+x.trim())});
      else used.add(d.plugin+'|'+b.type.replace(/^p/,'').replace(/^./,c=>c.toLowerCase()));
    }
  });
  const byPlugin={};
  used.forEach(u=>{
    const [p,name]=u.split('|');
    if(!PLUGIN_EXPORTS[p]||!PLUGIN_EXPORTS[p].includes(name))return;
    (byPlugin[p]=byPlugin[p]||new Set()).add(name);
  });
  need.forEach(p=>{if(!byPlugin[p]&&PLUGIN_EXPORTS[p]&&PLUGIN_EXPORTS[p].length)byPlugin[p]=new Set([PLUGIN_EXPORTS[p][0]])});
  return Object.keys(byPlugin).sort().map(p=>'import { '+[...byPlugin[p]].join(', ')+' } from "@plugins/'+p+'";');
}

function generateCode(){
  const ctx=new Set();
  const parts=[];
  const imports=buildImports();
  if(imports.length)parts.push(imports.join('\n'));
  const body=[];
  stacks.forEach(s=>{
    if(!s.blocks||!s.blocks.length)return;
    body.push(genList(s.blocks,new Set(ctx),''));
  });
  if(body.length)parts.push(body.join('\n\n'));
  return parts.length?parts.join('\n\n'):'// '+tr('codeDrag').replace(/^\/\/\s*/,'');
}

/* ============================================================
   Tree helpers
   ============================================================ */
function find(id,list){for(const s of stacks){const r=findIn(id,s.blocks);if(r)return r}return null}
function findIn(id,list){
  for(const b of list||[]){
    if(b.id===id)return b;
    if(b.children){const r=findIn(id,b.children);if(r)return r}
    if(b.children2){const r=findIn(id,b.children2);if(r)return r}
  }
  return null;
}
function locate(id,list,parent){
  for(let i=0;i<(list||[]).length;i++){
    const b=list[i];
    if(b.id===id)return {list,index:i,parent:parent||null};
    if(b.children){const r=locate(id,b.children,b);if(r)return r}
    if(b.children2){const r=locate(id,b.children2,b);if(r)return r}
  }
  return null;
}
function stackOf(id){return stacks.find(s=>locate(id,s.blocks))||null}
function removeBlock(id){
  for(const s of stacks){
    const loc=locate(id,s.blocks);
    if(loc){const [b]=loc.list.splice(loc.index,1);return b}
  }
  return null;
}
function findParentFuncName(targetId,list,current=null){
  for(const b of list||[]){
    const next=b.type==='callback'?String(b.params?.[0]||'').trim():current;
    if(b.id===targetId)return current;
    if(b.children){const r=findParentFuncName(targetId,b.children,next);if(r!==null)return r}
    if(b.children2){const r=findParentFuncName(targetId,b.children2,next);if(r!==null)return r}
  }
  return null;
}
function nearestFuncBefore(targetId){
  for(const s of stacks){
    let last=null;
    for(const b of s.blocks){
      if(b.id===targetId)return last;
      if(b.type==='callback')last=String(b.params?.[0]||'').trim();
    }
  }
  return null;
}
function fnParams(name){
  const f=eventFns.find(x=>x[0]===name);
  if(f)return f[1]||[];
  const c=customFns.find(x=>x.name===name);
  return c?parseArgs(c.params):[];
}
/* ============================================================
   Undo / redo + persistence
   ============================================================ */
function snapshot(){
  return JSON.stringify({stacks,vars,lists,customFns,uid});
}
function pushUndo(){
  const s=snapshot();
  if(undoStack.length&&undoStack[undoStack.length-1]===s)return;
  undoStack.push(s);
  if(undoStack.length>MAX_UNDO)undoStack.shift();
  redoStack.length=0;
  syncHistBtns();
}
function restoreSnap(s){
  const o=JSON.parse(s);
  stacks=o.stacks||[];
  vars=o.vars||[];
  lists=o.lists||[];
  customFns=o.customFns||[];
  uid=o.uid||1;
}
function undo(){
  if(!undoStack.length){toast(tr('nothingToUndo'));return}
  redoStack.push(snapshot());
  restoreSnap(undoStack.pop());
  renderAll();syncHistBtns();
}
function redo(){
  if(!redoStack.length)return;
  undoStack.push(snapshot());
  restoreSnap(redoStack.pop());
  renderAll();syncHistBtns();
}
function syncHistBtns(){
  const u=$('#undoBtn'),r=$('#redoBtn');
  if(u)u.disabled=!undoStack.length;
  if(r)r.disabled=!redoStack.length;
}
function projectData(){
  return {version:STORAGE_VERSION,app:'bloxd-blocks-studio',savedAt:new Date().toISOString(),
    stacks,vars,lists,customFns,uid,view};

function migrateLegacy(raw){
  // v1 stored {blocks:[...]} linearly; convert to one stack
  const out={stacks:[],vars:[],lists:[],customFns:[],uid:1};
  if(Array.isArray(raw.blocks)){
    out.stacks.push({id:'s1',x:20,y:20,blocks:raw.blocks});
  }else if(Array.isArray(raw.stacks)){
    out.stacks=raw.stacks;
  }
  out.vars=Array.isArray(raw.vars)?raw.vars:[];
  out.lists=Array.isArray(raw.lists)?raw.lists:[];
  out.customFns=Array.isArray(raw.customFns)?raw.customFns:[];
  out.uid=raw.uid||1;
  return out;
}
function loadProject(){
  let raw=null;
  try{raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(e){raw=null}
  if(!raw)return false;
  const o=migrateLegacy(raw);
  stacks=(o.stacks||[]).map((s,i)=>({id:s.id||'s'+(i+1),x:Number(s.x)||20+i*24,y:Number(s.y)||20+i*24,blocks:s.blocks||[]}));

function sanitizeBlocks(list){
  for(let i=(list||[]).length-1;i>=0;i--){
    const b=list[i],d=defs[b.type];
    if(!d||d.valueOnly&&!b.children){list.splice(i,1);continue}
    if(b.children&&d.container!==true&&!(d.container)){delete b.children;continue}
    if(b.children)sanitizeBlocks(b.children);
    if(b.children2)sanitizeBlocks(b.children2);
    if(b.params)scanNested(b.params,nb=>{if(nb.children)sanitizeBlocks(nb.children)});

let toastTimer=null;

function modal(title,sub,build){

  b.className='box';
  const h=document.createElement('h3');h.textContent=title;b.append(h);
  if(sub){const p=document.createElement('div');p.className='sub';p.textContent=sub;b.append(p)}

  b.append(actions);

function ctxMenu(items,x,y){

  items.forEach(it=>{
    if(it==='-'){m.append(document.createElement('hr'));return}
    const btn=document.createElement('button');
    btn.innerHTML='<span class="cmIco">'+icon(it.icon||'caretRight',14)+'</span><span>'+it.label+'</span>'+(it.key?'<span class="cKey">'+it.key+'</span>':'');
    if(it.danger)btn.className='danger';
    btn.onclick=()=>{m.remove();it.fn()};
    m.append(btn);
  });
  document.body.append(m);
  const r=m.getBoundingClientRect();
  m.style.left=Math.min(x,innerWidth-r.width-8)+'px';
  m.style.top=Math.min(y,innerHeight-r.height-8)+'px';
  setTimeout(()=>document.addEventListener('mousedown',function h(e){if(!m.contains(e.target)){m.remove();document.removeEventListener('mousedown',h)}}),0);
}

function toolEl(type,extraClass){

  const el=document.createElement('button');
  el.className='tool '+(extraClass||'');
  el.style.setProperty('--cat',c.color);

  el.dataset.type=type;

  el.addEventListener('dragstart',e=>{

    drag={kind:'new',type};
  });
  el.addEventListener('dragend',()=>{drag=null;clearDropHints()});
  el.onclick=()=>{
    const b=newBlock(type);
    if(!b)return;
    if(d.module){
      /* modules only fit slots whose parameter accepts that type */
      pushUndo();
      const slot=acFirstSlotFor(d.module);
      if(slot){
        slot.b.params[slot.idx]=b;
        renderAll();
        toast(modLabel(d.module,LANG())+' -> '+slotLabelText(slot));

/* ============================================================
   Rendering: workspace
   ============================================================ */
function renderAll(){
  sanitizeAll();
  renderWorkspace();
  renderCode();
  updateStats();
  syncHistBtns();
}
function renderWorkspace(){
  const canvas=$('#canvas');
  canvas.innerHTML='';
  if(!stacks.length||stacks.every(s=>!s.blocks.length)){
    const e=document.createElement('div');
    e.className='empty';
    e.innerHTML='<strong>'+tr('emptyTitle')+'</strong><span>'+tr('emptySub')+'</span>';
    canvas.append(e);
    return;
  }
  stacks.forEach(s=>{
    if(!s.blocks.length)return;
    const wrap=document.createElement('div');
    wrap.className='stackWrap';
    wrap.style.left=(s.x||20)+'px';
    wrap.style.top=(s.y||20)+'px';
    const bar=document.createElement('div');
    bar.className='stackBar';
    bar.innerHTML='<span class="grip">'+icon('grip',12)+'</span><span>stack</span><span style="opacity:.6">'+countBlocks(s.blocks)+'</span>';
    bar.title='Drag to move this stack';
    bar.addEventListener('mousedown',e=>startStackDrag(e,s));
    wrap.append(bar);
    const dTop=document.createElement('div');
    dTop.className='dropzone';
    dTop.dataset.stack=s.id;dTop.dataset.index='0';
    hookDropzone(dTop,s,0);
    wrap.append(dTop);
    s.blocks.forEach((b,i)=>{wrap.append(blockEl(b,s));const dz=document.createElement('div');dz.className='dropzone';dz.dataset.stack=s.id;dz.dataset.index=String(i+1);hookDropzone(dz,s,i+1);wrap.append(dz)});
    canvas.append(wrap);
  });
  // grow canvas to fit
  let maxX=600,maxY=400;
  stacks.forEach(s=>{maxX=Math.max(maxX,(s.x||0)+1200);maxY=Math.max(maxY,(s.y||0)+800)});
  canvas.style.width=maxX+'px';
  canvas.style.minHeight=maxY+'px';
}
let stackDragState=null;
function startStackDrag(e,s){
  if(e.button!==0)return;
  e.preventDefault();e.stopPropagation();
  const scale=view.scale;
  stackDragState={s,ox:e.clientX,oy:e.clientY,sx:s.x||20,sy:s.y||20,moved:false,scale};
  document.body.style.cursor='grabbing';
}
document.addEventListener('mousemove',e=>{
  if(!stackDragState)return;
  const dx=(e.clientX-stackDragState.ox)/stackDragState.scale;
  const dy=(e.clientY-stackDragState.oy)/stackDragState.scale;
  if(Math.abs(dx)>1||Math.abs(dy)>1)stackDragState.moved=true;
  stackDragState.s.x=Math.round(stackDragState.sx+dx);
  stackDragState.s.y=Math.round(stackDragState.sy+dy);
  const wrap=$('#canvas').children[stacks.indexOf(stackDragState.s)];
  if(wrap){wrap.style.left=stackDragState.s.x+'px';wrap.style.top=stackDragState.s.y+'px'}
});
document.addEventListener('mouseup',()=>{
  if(stackDragState){
    if(stackDragState.moved)pushUndo();
    stackDragState=null;document.body.style.cursor='';
  }
});
function clearDropHints(){
  $$('.dropzone.dragover').forEach(d=>d.classList.remove('dragover'));
  $$('.valueSlot.dragover').forEach(d=>d.classList.remove('dragover'));
  $$('.block.dragging').forEach(d=>d.classList.remove('dragging'));
}
function hookDropzone(dz,stack,index){
  dz.addEventListener('dragover',e=>{
    if(!drag)return;
    e.preventDefault();e.stopPropagation();
    dz.classList.add('dragover');
  });
  dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
  dz.addEventListener('drop',e=>{
    e.preventDefault();e.stopPropagation();
    dz.classList.remove('dragover');
    handleStatementDrop(e,stack,index);
  });
}
function moveTo(stack,index,b){
  removeBlock(b.id);
  stack.blocks.splice(Math.min(index,stack.blocks.length),0,b);
}
function handleStatementDrop(e,stack,index){
  const typeId=e.dataTransfer.getData('application/x-block-id');
  const newType=e.dataTransfer.getData('application/x-block-type');
  const cbName=e.dataTransfer.getData('application/x-callback');
  pushUndo();
  if(typeId){
    const b=find(typeId);
    if(b)moveTo(stack,index,b);
  }else if(newType){
    const b=newBlock(newType);
    if(b)stack.blocks.splice(Math.min(index,stack.blocks.length),0,b);
  }else if(cbName){
    const b=hatCallback(cbName);
    // a callback becomes its own stack
    const s={id:'s'+(stacks.length+1),x:(stack?stack.x:20)+((stack?stack.blocks.length:0)%2)*0,y:(stack?stack.y:20)+60,blocks:[b]};
    stacks.push(s);
  }
  renderAll();
}
function slotLabelText(slot){
  const d=defs[slot.b.type]||{};
  return (d.label||slot.b.type)+'['+((d.paramNames&&d.paramNames[slot.idx])||slot.idx)+']';
}
/* tell the user why a module could not go in that slot */
function acSlotReject(b,idx,modId){
  const allowed=modAllowedIn(b,idx);
  const d=defs[b.type]||{};
  const where=(d.label||b.type)+'.'+((d.paramNames&&d.paramNames[idx])||idx);
  let msg;
  if(allowed)msg=LANG()==='fr'
    ?modLabel(modId,LANG())+' ne va pas dans '+where+' — attendu : '+modSlotLabel(b,idx)
    :modLabel(modId,LANG())+' does not fit '+where+' — expected: '+modSlotLabel(b,idx);
  else msg=LANG()==='fr'
    ?where+' n’accepte pas de module (texte structuré uniquement)'
    :where+' does not accept a module (structured text only)';
  toast(msg,true);
}
/* first empty value slot that accepts this module */
function acFirstSlotFor(modId){
  let found=null;
  const walk=list=>{
    (list||[]).forEach(b=>{
      if(found)return;
      (b.params||[]).forEach((v,i)=>{
        if(found)return;
        if((v===''||v==null)&&modFitsSlot(modId,b,i))found={b,idx:i};
      });
      walk(b.children);walk(b.children2);
    });
  };
  stacks.forEach(st=>walk(st.blocks));
  return found;
}
/* first empty value slot in the workspace, used when a module is clicked in the palette */
function acFirstEmptySlot(){
  let found=null;
  const walk=list=>{
    (list||[]).forEach(b=>{
      if(found)return;
      const d=defs[b.type]||{};
      (b.params||[]).forEach((v,i)=>{
        if(found)return;
        if(v===''||v==null){
          const pname=(d.paramNames&&d.paramNames[i])||'';
          const wants=acSlotWants(b,i);
          if(pname||wants!=='any')found={b,idx:i};
        }
      });
      walk(b.children);walk(b.children2);
    });
  };
  stacks.forEach(st=>walk(st.blocks));
  return found;
}
function newBlock(type){
  const d=defs[type];
  if(!d)return null;
  if(d.module)return modNew(d.module);
  const b={id:newid(),type,params:clone(d.params||[])};
  if(d.container){b.children=[];if(d.twoBodies)b.children2=[]}
  return b;
}
function hatCallback(name){
  return {id:newid(),type:'callback',params:[name],children:[]};
}
function addStack(blocks){
  const s={id:'s'+(stacks.length+1),x:30+((stacks.length%4)*40),y:30+((stacks.length%6)*40),blocks};
  stacks.push(s);
  return s;
}
/* ============================================================
   Block element
   ============================================================ */
function catColor(catId){const c=cats.find(x=>x.id===catId);return c?c.color:'#3d6fff'}
function blockEl(b,stack){
  const d=defs[b.type];
  const el=document.createElement('div');
  el.className='block'+(b.disabled?' disabled':'')+(b.collapsed?' collapsed':'');
  el.dataset.id=b.id;
  const bc=catColor(d?d.cat:'logic');
  el.style.setProperty('--bc',bc);
  const head=document.createElement('div');
  head.className='blockHead'+(d&&d.hat?' hat':'');
  head.draggable=true;
  const handle=document.createElement('span');
  handle.className='handle';handle.textContent='⠿';handle.title='Drag';
  head.append(handle);
  if(d&&d.hat){const hb=document.createElement('span');hb.className='hatBadge';hb.textContent='HAT';head.append(hb)}
  const mini=document.createElement('span');
  mini.className='codeMini';
  renderInline(b,mini);
  head.append(mini);
  if(d&&d.container){
    const col=document.createElement('button');
    col.className='miniBtn';
    col.textContent=b.collapsed?'▸':'▾';
    col.title=tr('ctxCollapse');
    col.onclick=e=>{e.stopPropagation();pushUndo();b.collapsed=!b.collapsed;renderWorkspace()};
    head.append(col);
  }
  el.append(head);
  if(d&&d.container){
    const body=document.createElement('div');
    body.className='body';
    body.dataset.body='1';
    renderBody(body,b,'children');
    el.append(body);
    if(d.twoBodies){
      const brace=document.createElement('div');
      brace.className='closeBrace';
      brace.textContent='} '+tr('body2')+' {';
      el.append(brace);
      const body2=document.createElement('div');
      body2.className='body';
      body2.dataset.body='2';
      renderBody(body2,b,'children2');
      el.append(body2);
    }
    const closer=document.createElement('div');
    closer.className='closeBrace';
    closer.textContent='}';
    el.append(closer);
  }
  // drag whole block
  head.addEventListener('dragstart',e=>{
    e.stopPropagation();
    e.dataTransfer.setData('application/x-block-id',b.id);
    e.dataTransfer.effectAllowed='move';
    drag={kind:'move',id:b.id};
    el.classList.add('dragging');
  });
  head.addEventListener('dragend',()=>{el.classList.remove('dragging');drag=null;clearDropHints()});
  el.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();blockMenu(b,e.clientX,e.clientY)});
  head.addEventListener('dblclick',()=>{ if(defs[b.type]&&defs[b.type].container){pushUndo();b.collapsed=!b.collapsed;renderWorkspace()} });
  return el;
}
function renderBody(host,b,key){
  const list=b[key]||(b[key]=[]);
  const dz0=document.createElement('div');
  dz0.className='dropzone';dz0.dataset.stack='';dz0.dataset.index='0';
  hookBodyDropzone(dz0,b,key,0);
  host.append(dz0);
  if(!list.length){
    const e=document.createElement('div');
    e.className='bodyEmpty';e.textContent=tr('bodyEmpty');
    host.append(e);
  }
  list.forEach((child,i)=>{
    host.append(blockEl(child));
    const dz=document.createElement('div');
    dz.className='dropzone';
    hookBodyDropzone(dz,b,key,i+1);
    host.append(dz);
  });
}
function hookBodyDropzone(dz,parent,key,index){
  dz.addEventListener('dragover',e=>{if(!drag)return;e.preventDefault();e.stopPropagation();dz.classList.add('dragover')});
  dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
  dz.addEventListener('drop',e=>{
    e.preventDefault();e.stopPropagation();
    dz.classList.remove('dragover');
    const typeId=e.dataTransfer.getData('application/x-block-id');
    const newType=e.dataTransfer.getData('application/x-block-type');
    pushUndo();
    const list=parent[key]||(parent[key]=[]);
    if(typeId){
      const moved=find(typeId);
      if(moved&&moved.id!==parent.id&&!isDesc(parent.id,typeId)){
        removeBlock(typeId);
        list.splice(Math.min(index,list.length),0,moved);
      }
    }else if(newType){
      const nb=newBlock(newType);
      if(nb)list.splice(Math.min(index,list.length),0,nb);
    }
    renderAll();
  });
}
function isDesc(parentId,childId){
  const p=find(parentId);
  if(!p)return false;
  const walk=l=>!!(l||[]).find(b=>b.id===childId||walk(b.children)||walk(b.children2));
  return walk(p.children)||walk(p.children2);
}

/* inline token renderer */
function renderInline(b,host){
  const d=defs[b.type];
  if(!d){host.textContent='Bloc inconnu';return}
  let tokens;
  try{tokens=d.inline(b)}catch(e){tokens=[['cmt',b.type]]}
  (tokens||[]).forEach(t=>host.append(tokenEl(b,t)));
}
function tokenEl(b,t){
  const kind=t[0];
  if(kind==='kw'){const s=document.createElement('span');s.className='tok-kw';s.textContent=t[1];return s}
  if(kind==='pun'){const s=document.createElement('span');s.className='tok-pun';s.textContent=t[1];return s}
  if(kind==='op'){const s=document.createElement('span');s.className='tok-op';s.textContent=t[1];return s}
  if(kind==='prop'){const s=document.createElement('span');s.className='tok-prop';s.textContent=t[1];return s}
  if(kind==='fn'){const s=document.createElement('span');s.className='tok-fn';s.textContent=t[1];return s}
  if(kind==='cmt'){const s=document.createElement('span');s.className='tok-cmt';s.textContent=t[1];return s}
  if(kind==='str'){const s=document.createElement('span');s.className='tok-str';s.textContent=t[1];return s}
  if(kind==='varkind')return varKindSelect(b,t[1]);
  if(kind==='choice'||kind==='input')return valueSlotEl(b,t[1],kind==='choice'?t[2]:null);
  if(kind==='args')return argsSlotEl(b,t[1]);
  if(kind==='callargs')return callArgsSlotEl(b,t[1]);
  const s=document.createElement('span');s.textContent=String(t[1]??'');return s;
}
function varKindSelect(b,idx){
  const sel=document.createElement('select');
  sel.className='sel';
  sel.style.cssText='min-width:52px;font-size:11px;padding:2px 4px';
  ['var','let','const'].forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;sel.append(o)});
  sel.value=['var','let','const'].includes(String(b.params[idx]))?String(b.params[idx]):'var';
  sel.title=tr('varTypeTitle')||'Declaration keyword';
  sel.onchange=()=>{pushUndo();b.params[idx]=sel.value;renderCode()};
  sel.onmousedown=e=>e.stopPropagation();
  return sel;
}
/* value slot: accepts reporters dropped from palette */
function valueSlotEl(b,idx,choiceKey){
  const wrap=document.createElement('span');
  wrap.className='valueSlot';
  wrap.dataset.slot='1';
  wrap.dataset.block=b.id;
  wrap.dataset.idx=String(idx);
  wrap.dataset.slot='1';
  wrap.dataset.block=b.id;
  wrap.dataset.idx=String(idx);
  const render=()=>{
    wrap.innerHTML='';
    const val=b.params[idx];
    if(isNested(val)){
      wrap.classList.add('hasReporter');
      const chip=document.createElement('span');
      chip.className='valueBlock';
      chip.style.setProperty('--bc',catColor(defs[val.type]?defs[val.type].cat:'variables'));
      const inner=document.createElement('span');
      inner.className='codeMini';
      inner.style.fontSize='11.5px';
      renderInline(val,inner);
      chip.append(inner);
      const rm=document.createElement('button');
      rm.className='valueRemove';rm.innerHTML=icon('close',10);rm.title=tr('delete');
      rm.onclick=e=>{e.stopPropagation();pushUndo();b.params[idx]='';renderAll()};
      chip.append(rm);
      chip.draggable=true;
      chip.addEventListener('dragstart',e=>{
        e.stopPropagation();
        e.dataTransfer.setData('application/x-block-id',val.id);
        e.dataTransfer.effectAllowed='move';
        drag={kind:'move',id:val.id};
      });
      chip.addEventListener('dragend',()=>{drag=null;clearDropHints()});
      wrap.append(chip);
      return;
    }
    if(modIsValue(val)){wrap.append(moduleEditor(val,v=>{b.params[idx]=v;renderCode()}));return}
    if(isValueObj(val)){wrap.append(valueEditor(val,v=>{b.params[idx]=v;renderAll()}));return}
    if(choiceKey){
      const opts=choiceOptions(b,idx,choiceKey);
      if(opts&&opts.length){
        const sel=document.createElement('select');
        sel.className='sel';
        sel.style.cssText='min-width:60px;font-size:11.5px;padding:1px 4px;background:transparent;border:0';
        opts.forEach(o=>{const op=document.createElement('option');op.value=o.value;op.textContent=o.label;sel.append(op)});
        if(!opts.some(o=>o.value===val)){const op=document.createElement('option');op.value=String(val||'');op.textContent=String(val||'');sel.append(op)}
        sel.value=String(val??'');
        sel.onchange=()=>{pushUndo();b.params[idx]=sel.value;renderAll()};
        wrap.append(sel);
        return;
      }
    }
    const inp=document.createElement('input');
    inp.className='slotInput';
    inp.value=String(val??'');
    inp.placeholder=placeholderFor(b,idx);
    inp.size=Math.max(4,Math.min(34,String(inp.value).length||4));
    inp.oninput=()=>{b.params[idx]=inp.value;inp.size=Math.max(4,Math.min(34,inp.value.length||4));renderCode();updateStats()};
    inp.onchange=()=>{pushUndo();renderAll()};
    inp.onmousedown=e=>e.stopPropagation();
    acAttach(inp,()=>b,()=>idx,v=>{b.params[idx]=v;inp.size=Math.max(4,Math.min(34,v.length||4));renderCode();updateStats()});
    wrap.append(inp);
  };
  render();
  wrap.addEventListener('dragover',e=>{
    if(!drag)return;
    if(drag.kind==='move'){
      const moved=find(drag.id);
      if(!moved||!defs[moved.type]||!defs[moved.type].expr)return;
      if(moved.id===b.id)return;
    }
    /* dropping a brand-new module or reporter is always allowed */
    e.preventDefault();e.stopPropagation();
    wrap.classList.add('dragover');
  });
  wrap.addEventListener('dragleave',()=>wrap.classList.remove('dragover'));
  wrap.addEventListener('drop',e=>{
    e.preventDefault();e.stopPropagation();
    wrap.classList.remove('dragover');
    const typeId=e.dataTransfer.getData('application/x-block-id');
    const newType=e.dataTransfer.getData('application/x-block-type');
    pushUndo();
    if(typeId){
      const moved=find(typeId);
      if(moved&&defs[moved.type]&&defs[moved.type].expr&&moved.id!==b.id&&!isDesc(moved.id,b.id)&&!isDesc(b.id,moved.id)){
        removeBlock(typeId);
        b.params[idx]=moved;
      }
    }else if(newType){
      const d=defs[newType];
      if(d&&d.module){
        if(modFitsSlot(d.module,b,idx))b.params[idx]=newBlock(newType);
        else{acSlotReject(b,idx,d.module);pushUndo();undoSilent();}
      }
      else if(d&&d.expr){b.params[idx]=newBlock(newType)}
    }
    renderAll();
  });
  return wrap;
}

function findStackLoc(id){
  for(const s of stacks){
    const r=locate(id,s.blocks);
    if(r)return r;
  }
  return null;
}
function duplicateBlock(id){
  const b=find(id);
  if(!b)return;
  const cp=clone(b);
  const reid=o=>{o.id=newid();(o.children||[]).forEach(reid);(o.children2||[]).forEach(reid);scanNested(o.params||[],n=>reid(n))};
  reid(cp);
  const loc=findStackLoc(id);
  if(loc)loc.list.splice(loc.index+1,0,cp);
}
/* ============================================================
   Code panel
   ============================================================ */
const CHAR_LIMIT=32768;
function highlight(src){
  const tokens=[];
  const stash=(html)=>{tokens.push(html);return '\u0000'+(tokens.length-1)+'\u0000'};
  let s=String(src);
  // comments
  s=s.replace(/\/\/[^\n]*/g,m=>stash('<span class="cmt">'+esc(m)+'</span>'));
  // strings + template literals
  s=s.replace(/(["'`])(?:\\.|(?!\1)[^\\])*\1/gs,m=>stash('<span class="str">'+esc(m)+'</span>'));
  // numbers
  s=s.replace(/\b(-?\d+(?:\.\d+)?)\b/g,m=>stash('<span class="num">'+esc(m)+'</span>'));
  // keywords
  s=s.replace(/\b(const|let|var|function|return|if|else|for|while|of|in|new|true|false|null|undefined|break|continue|try|catch|finally|import|from|await|async|typeof|instanceof|delete|void|this|class|extends)\b/g,m=>stash('<span class="kw">'+esc(m)+'</span>'));
  // api / functions
  s=s.replace(/\b(api)(?=\.)/g,m=>stash('<span class="prop">'+esc(m)+'</span>'));
  s=s.replace(/\b([A-Za-z_$][\w$]*)(?=\s*\()/g,m=>stash('<span class="fn">'+esc(m)+'</span>'));
  s=s.replace(/\b([A-Za-z_$][\w$]*)(?=:)/g,m=>stash('<span class="prop">'+esc(m)+'</span>'));
  s=s.replace(/\u0000(\d+)\u0000/g,(_,i)=>tokens[+i]);
  return s;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderCode(){
  const code=generateCode();
  const pre=$('#code');
  if(!pre)return;
  const lines=code.split('\n');
  pre.innerHTML=lines.map((l,i)=>'<div class="line"><span class="ln">'+(i+1)+'</span><span class="txt">'+(highlight(l)||'&nbsp;')+'</span></div>').join('');
  return code;
}
function updateStats(){
  const code=generateCode();
  const n=totalBlocks();
  const c=code.length;
  const stat=$('#codeStat');
  if(stat){
    stat.textContent=c+' / '+CHAR_LIMIT;
    stat.className='codeStat'+(c>CHAR_LIMIT?' over':'');
    stat.title=c>CHAR_LIMIT?tr('overLimit'):'';
  }
  const cnt=$('#count');
  if(cnt){
    cnt.textContent=n+' '+(n===1?tr('blockSing'):tr('blockPlur'))+' · '+c+' chars';
    cnt.className='count'+(c>CHAR_LIMIT?' over':'');
  }
}
