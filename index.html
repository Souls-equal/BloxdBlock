    const ta=document.createElement('textarea');
    ta.placeholder='{ "stacks": [...], "vars": [...] }';
    body.append(ta);
    const go=document.createElement('button');go.className='btnPrimary';go.innerHTML=icon('import',14)+'<span>'+tr('applyImport')+'</span>';
    go.onclick=()=>{
      let raw=null;
      try{raw=JSON.parse(ta.value)}catch(e){toast(tr('badJson'),true);return}
      if(!raw||typeof raw!=='object'){toast(tr('badJson'),true);return}
      const o=migrateLegacy(raw);
      pushUndo();
      stacks=(o.stacks||[]).map((s,i)=>({id:s.id||'s'+(i+1),x:Number(s.x)||20+i*24,y:Number(s.y)||20+i*24,blocks:s.blocks||[]}));
      vars=o.vars||[];lists=o.lists||[];customFns=o.customFns||[];uid=o.uid||1;
      renderAll();
      toast(tr('imported'));
      close();
    };
    actions.append(go);
  });
}

/* ============================================================
   Layout: pan / zoom / resizers
   ============================================================ */
function applyView(){
  const c=$('#canvas');
  c.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.scale+')';
  $('#zoomLabel').textContent=Math.round(view.scale*100)+'%';
}
function zoomAt(factor,cx,cy){
  const r=$('#workspace').getBoundingClientRect();
  const old=view.scale;
  const next=Math.max(.25,Math.min(2.5,old*factor));
  if(next===old)return;
  const px=cx-r.left,py=cy-r.top;
  const wx=(px-view.x)/old,wy=(py-view.y)/old;
  view.scale=next;
  view.x=px-wx*next;
  view.y=py-wy*next;
  applyView();
}
function setupWorkspace(){
  const ws=$('#workspace');
  let pan=null;
  ws.addEventListener('mousedown',e=>{
    if(e.target!==ws&&!e.target.classList.contains('canvas'))return;
    if(e.button!==0&&e.button!==1)return;
    e.preventDefault();
    pan={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};
    ws.classList.add('panning');
  });
  window.addEventListener('mousemove',e=>{
    if(!pan)return;
    view.x=pan.vx+(e.clientX-pan.x);
    view.y=pan.vy+(e.clientY-pan.y);
    applyView();
  });
  window.addEventListener('mouseup',()=>{pan=null;ws.classList.remove('panning')});
  ws.addEventListener('wheel',e=>{
    if(e.ctrlKey||e.metaKey){
      e.preventDefault();
      zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY);
    }else{
      e.preventDefault();
      view.x-=e.deltaX;
      view.y-=e.deltaY;
      applyView();
    }
  },{passive:false});
  ws.addEventListener('dragover',e=>{e.preventDefault()});
  ws.addEventListener('drop',e=>{
    if(e.defaultPrevented)return;
    e.preventDefault();
    const type=e.dataTransfer.getData('application/x-block-type');
    const cb=e.dataTransfer.getData('application/x-callback');
    if(!type&&!cb)return;
    pushUndo();
    const r=ws.getBoundingClientRect();
    const x=Math.round((e.clientX-r.left-view.x)/view.scale);
    const y=Math.round((e.clientY-r.top-view.y)/view.scale);
    if(cb){stacks.push({id:'s'+Date.now(),x,y,blocks:[hatCallback(cb)]})}
    else{const nb=newBlock(type);if(nb)stacks.push({id:'s'+Date.now(),x,y,blocks:[nb]})}
    renderAll();
  });
  ws.addEventListener('contextmenu',e=>{
    if(e.target!==ws&&!e.target.classList.contains('canvas'))return;
    e.preventDefault();
    const r=ws.getBoundingClientRect();
    const x=Math.round((e.clientX-r.left-view.x)/view.scale);
    const y=Math.round((e.clientY-r.top-view.y)/view.scale);
    ctxMenu([
      {icon:'lightning',label:'Add hat block here',fn:()=>{pushUndo();stacks.push({id:'s'+Date.now(),x,y,blocks:[hatCallback('tick')]});renderAll()}},
      {icon:'broom',label:tr('cleanUp'),fn:cleanUp},
      {icon:'search',label:tr('resetView'),fn:()=>{view={x:0,y:0,scale:1};applyView()}}
    ],e.clientX,e.clientY);
  });
}
function cleanUp(){
  pushUndo();
  let y=24;
  stacks.forEach(s=>{
    if(!s.blocks.length)return;
    s.x=24;s.y=y;
    const est=60+countBlocks(s.blocks)*52+40;
    y+=est;
  });
  renderWorkspace();
}
function setupResizers(){
  const app=$('#app');
  let st=null;
  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  const begin=(e,type)=>{
    if(e.button!==0)return;
    e.preventDefault();
    const cs=getComputedStyle(app);
    st={type,x:e.clientX,y:e.clientY,
      left:parseInt(cs.getPropertyValue('--leftW'))||280,
      code:parseInt(cs.getPropertyValue('--codeW'))||390,
      tabs:$('#tabs').getBoundingClientRect().height};
  };
  [[$('#leftResize'),'left'],[$('#codeResize'),'code'],[$('#tabResize'),'tabs']].forEach(([el,type])=>{
    if(!el)return;
    el.addEventListener('mousedown',e=>{begin(e,type);el.classList.add('active')});
  });
  window.addEventListener('mousemove',e=>{
    if(!st)return;
    if(st.type==='left')app.style.setProperty('--leftW',clamp(st.left+(e.clientX-st.x),180,520)+'px');
    if(st.type==='code')app.style.setProperty('--codeW',clamp(st.code-(e.clientX-st.x),220,720)+'px');
    if(st.type==='tabs')$('#tabs').style.height=clamp(st.tabs+(e.clientY-st.y),58,240)+'px';
  });
  window.addEventListener('mouseup',()=>{
    st=null;
    $$('.vResize,#tabResize').forEach(x=>x.classList.remove('active'));
  });
}

    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){if(!typing){e.preventDefault();undo()}}

/* ---------- scope helpers ---------- */
function acBlockById(id,list){
  for(const b of list||[]){
    if(b.id===id)return b;
    const r=acBlockById(id,b.children)||acBlockById(id,b.children2);
    if(r)return r;
  }
  return null;
}
function acAncestors(targetId,list,chain){
  chain=chain||[];
  for(const b of list||[]){
    if(b.id===targetId)return chain;
    const r=acAncestors(targetId,b.children,chain.concat(b))||acAncestors(targetId,b.children2,chain.concat(b));
    if(r)return r;
  }
  return null;
}
/* identifiers visible where block b sits: globals + locals introduced by ancestor hats and loops */
function acScopeIds(b){
  const ids=new Set();
  if(!b){vars.forEach(v=>ids.add(v.name));lists.forEach(l=>ids.add(l.name));
    customFns.forEach(f=>ids.add(f.name));['thisPos','playerId','myId','api'].forEach(x=>ids.add(x));return [...ids]}
  const add=v=>{const s=String(v||'').trim();if(/^[A-Za-z_$][\w$]*$/.test(s))ids.add(s)};
  vars.forEach(v=>add(v.name));
  lists.forEach(l=>add(l.name));
  customFns.forEach(f=>add(f.name));
  add('thisPos');add('playerId');add('myId');add('api');
  const chain=b?acAncestors(b.id,(stacks.find(s=>acBlockById(b.id,s.blocks))||{}).blocks||[]):[];
  (chain||[]).forEach(a=>{
    const d=defs[a.type]||{};
    if(a.type==='callback'){
      fnParams(String(a.params[0]||'')).forEach(add);
    }else if(a.type==='func'){
      parseArgs(a.params[1]).forEach(add);
    }else if(a.type==='forOf'||a.type==='forIn'){
      add(a.params[0]);
    }else if(a.type==='tryCatch'&&a.children2&&a.children2.some(x=>x.id===b.id)){
      add(a.params[0]);
    }
  });
  return [...ids];
}
/* local variables declared before the block, anywhere in the same stack */
function acDeclaredBefore(b,stack){
  const out=[];
  if(!stack)return out;
  const walk=(list)=>{
    for(const x of list||[]){
      if(x.id===b.id)return true;
      if(x.type==='assign'){const raw=String(x.params[0]||'');const m=raw.match(/[A-Za-z_$][\w$]*/g)||[];m.forEach(n=>out.push(n))}
      if(walk(x.children))return true;
      if(walk(x.children2))return true;
    }
    return false;
  };
  walk(stack.blocks);
  return out;
}
/* ---------- suggestion surface for a slot ---------- */
function acContext(b,idx){
  const d=defs[b.type]||{};
  const pname=(d.paramNames&&d.paramNames[idx])||'';
  const ch=(d.choices&&d.choices[idx])||null;
  return {d,pname,ch};
}
function acEnum(kind){
  if(API_CHOICES[kind])return API_CHOICES[kind].map(o=>unq(o.value));
  if(kind==='entitySettingValue')return [];
  if(AC_DATA[kind])return AC_DATA[kind].slice();
  return [];
}
/* all candidates for (block, param index), as {v,label,kind,hint} */

/* ---------- variable typing ----------
   We do not have declared types, so we infer from how each name is used:
   numbers, text, booleans, lists, objects, entities, or unknown.
   Inference scans every assignment / call argument in the project.        */
const AC_NUMERIC_HINT=/^(x|y|z|i|n|j|k|t|amount|value|count|score|coins|health|level|speed|volume|rate|duration|total|num|number|index|idx|radius|distance|height|width|timer|progress|damage|price|id|ticks|ms|delta|strength|power|hp|mana|xp|exp|coins|points|kills|deaths|wins|losses)$/i;
/* names that read like text/booleans/collections: never offered for a number slot */
const AC_NONNUMERIC_HINT=/(name|label|text|message|title|desc|key|word|str|reason|type|kind|colour|color|icon|path|url|prefix|suffix|tag|id)$|^(is|has|can|should|was|did|will|allow|enable|disable|show|hide)/i;
function acInferTypes(){
  const T={};
  const note=(name,kind)=>{name=String(name||'').trim();if(!/^[A-Za-z_$][\w$]*$/.test(name))return;
    if(!T[name])T[name]={num:0,str:0,bool:0,list:0,obj:0};
    if(kind&&T[name][kind]!==undefined)T[name][kind]++};
  const classify=v=>{
    if(v&&typeof v==='object'){
      if(v.__value==='list')return 'list';
      if(v.__value==='object')return 'obj';
      if(v.type&&defs[v.type]&&defs[v.type].expr)return acReturnKind(v.type);
      return null;
    }
    const raw=String(v??'').trim();
    if(!raw)return null;
    if(/^\[/.test(raw))return 'list';
    if(/^\{/.test(raw))return 'obj';
    if(/^(true|false)$/.test(raw))return 'bool';
    if(/^-?\d+(\.\d+)?$/.test(raw))return 'num';
    if(/^(['"`]).*\1$/s.test(raw))return 'str';
    if(/^[A-Za-z_$][\w$]*$/.test(raw))return 'ident';
    return null;
  };
  const walk=(list,scope)=>{
    (list||[]).forEach(b=>{
      const d=defs[b.type]||{};
      /* local numeric loop counters */
      if(b.type==='repeat')note(scope['_i'],'num');
      if(b.type==='assign'){
        const names=(String(b.params[0]||'').match(/[A-Za-z_$][\w$]*/g)||[]);
        const k=classify(b.params[1]);

function acLocalFnNames(){

/* ---------- popup ---------- */
let acState=null;
function acPopup(){

  return el;
}

function acRender(inp,items,sel){
  const pop=acPopup();

  head.className='acHead';
  head.textContent=(items.length===1?fmtTpl('acOne',{'n':items.length}):fmtTpl('acMany',{'n':items.length}));
  pop.append(head);
  items.forEach((it,i)=>{
    const row=document.createElement('button');
    row.type='button';
    row.className='acItem'+(i===sel?' sel':'');
    row.dataset.i=String(i);
    const k=document.createElement('span');
    k.className='acKind ac-'+it.kind;
    k.textContent=it.hint||it.kind;
    const v=document.createElement('span');
    v.className='acVal';
    v.textContent=it.v;
    row.append(k,v);
    row.addEventListener('mousedown',e=>{e.preventDefault()});
    row.addEventListener('click',e=>{e.preventDefault();acAccept(i)});
    pop.append(row);
  });

  const maxH=Math.min(268,window.innerHeight-24);
  pop.style.display='block';
  pop.style.maxHeight=maxH+'px';
  /* place under the input, flip above when there is no room */
  const below=window.innerHeight-rect.bottom, above=rect.top;
  pop.style.minWidth=Math.max(rect.width,190)+'px';
  if(below<maxH&&above>below){pop.style.top=(rect.top-pop.offsetHeight-4)+'px'}
  else{pop.style.top=(rect.bottom+4)+'px'}
  pop.style.left=Math.max(6,Math.min(rect.left,window.innerWidth-pop.offsetWidth-6))+'px';
  const selRow=pop.querySelector('.acItem.sel');

/* wire an <input> so it offers contextual completions */

    if(inp.value.length<1){acHide();return}

        +(it.kind==='variable'&&wants!=='any'&&it.vKind!==wants?8:0)}))
    .filter(x=>x.score>=0&&acCompatible(x.it,wants))
    .sort((a,b2)=>a.score-b2.score||(text?a.it.v.length-b2.it.v.length:0))
    .slice(0,60)
    .map(x=>x.it);
  if(!items.length){acHide();return}
  acState={inp,items,sel:0,commit,text};
  acRender(inp,items,0);
}
/* append typed text for tests / programmatic use */
function acSuggestFor(b,idx,text){
  const prio=acPriority(b,idx),wants=acSlotWants(b,idx);
  return acCandidates(b,idx)
    .map(it=>({it,score:acScore(it,text||'',prio)
        +(it.kind==='variable'?((text||'').length?0:1.5):0)
        +(it.kind==='variable'&&wants!=='any'&&it.vKind!==wants?8:0)}))
    .filter(x=>x.score>=0&&acCompatible(x.it,wants))
    .sort((a,b2)=>a.score-b2.score||(text?a.it.v.length-b2.it.v.length:0))
    .map(x=>x.it);
}

/* ============================================================
   Boot
   ============================================================ */
function paintIconSlots(root){
  (root||document).querySelectorAll('.islot[data-icon]').forEach(el=>{
    const n=el.getAttribute('data-icon');
    el.innerHTML=icon(n,el.classList.contains('big')?18:15);
  });
}
function boot(){
  paintIconSlots();
  registerModules();
  registerApiMethods(API_METHODS);
  registerApiValueSnippets(API_METHODS);
  applyLangStatic();
  applyTheme();
  applyCodeWrap();
  renderTabs();
  renderPalette();
  setupWorkspace();
  setupResizers();
  wireToolbar();
  const had=loadProject();
  applyView();
  renderAll();
  if(!had){
    // first run: a small welcome stack so the canvas is not empty
    stacks=[{id:'s1',x:24,y:24,blocks:[hatCallback('tick')]}];
    renderAll();
  }
  $('#hint').classList.toggle('hidden',hintHidden);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();
</script>
